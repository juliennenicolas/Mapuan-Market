<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Mapúan Marketplace</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div data-nav></div>
  <main class="auth-wrap">
    <section class="auth-visual">
      <div class="eyebrow" style="width:max-content;background:white">Mapúa-only marketplace</div>
      <h1>Buy from people you already share a campus with.</h1>
      <p style="max-width:560px">Verified student access, campus meet-ups, and direct messaging in one place.</p>
    </section>

    <section class="auth-panel">
      <div class="auth-box">
        <h2>Welcome back.</h2>
        <p class="muted">Use your Mapúa student email.</p>

        <form id="loginForm" style="display:grid;gap:14px;margin-top:24px">
          <div class="form-group">
            <label>Email</label>
            <input class="input" type="email" name="email" required placeholder="student@mymail.mapua.edu.ph">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input class="input" type="password" name="password" required>
          </div>
          <button class="btn btn-primary" type="submit">Log in</button>
        </form>

        <p class="muted" style="margin-top:18px">
          New here? <a href="./register.html" style="color:var(--red);font-weight:800">Create an account</a>
        </p>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/auth-pages.js"></script>
</body>
</html>
