<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell · Mapúan Marketplace</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div data-nav></div>
  <main class="page-shell">
    <div class="container" style="max-width:900px">
      <div class="page-head">
        <div>
          <div class="eyebrow">Create listing</div>
          <h1>Sell something useful.</h1>
          <p class="muted">Add the details students need to decide quickly.</p>
        </div>
      </div>

      <form class="panel form-grid" id="sellForm" enctype="multipart/form-data">
        <div class="form-group full">
          <label>Item title</label>
          <input class="input" name="title" required maxlength="160" placeholder="e.g. Casio FX-991EX Scientific Calculator">
        </div>

        <div class="form-group">
          <label>Price (PHP)</label>
          <input class="input" type="number" name="price" min="0" step="1" required placeholder="850">
        </div>

        <div class="form-group">
          <label>Category</label>
          <select class="select" name="categoryId" id="categoryId" required></select>
        </div>

        <div class="form-group">
          <label>Condition</label>
          <select class="select" name="condition">
            <option>Like New</option>
            <option selected>Good</option>
            <option>Fair</option>
            <option>Worn</option>
            <option>New</option>
          </select>
        </div>

        <div class="form-group">
          <label>Meet-up location</label>
          <select class="select" name="meetupLocation">
            <option>Either Campus</option>
            <option>Intramuros Campus</option>
            <option>Makati Campus</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea class="textarea" name="description" rows="6" placeholder="Mention edition, flaws, included accessories, reason for selling, etc."></textarea>
        </div>

        <div class="form-group full">
          <label>Photo</label>
          <input class="input" type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif">
          <small class="muted">JPG, PNG, WEBP, or GIF · max 5MB</small>
        </div>

        <div class="form-group full">
          <button class="btn btn-primary" type="submit">Publish listing</button>
        </div>
      </form>
    </div>
  </main>

<footer class="footer">
  <div class="container">Mapúan Marketplace · Built for safer campus peer-to-peer commerce.</div>
</footer>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/sell.js"></script>
</body>
</html>
