<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile · Mapúan Marketplace</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div data-nav></div>
  <main class="page-shell">
    <div class="container" style="max-width:760px">
      <div class="page-head">
        <div>
          <div class="eyebrow">Account</div>
          <h1>Your profile</h1>
          <p class="muted">Keep your campus and course information up to date.</p>
        </div>
      </div>

      <form class="panel form-grid" id="profileForm">
        <div class="form-group full">
          <label>Full name</label>
          <input class="input" name="fullName" required>
        </div>

        <div class="form-group full">
          <label>Mapúa email</label>
          <input class="input" name="email" disabled>
        </div>

        <div class="form-group">
          <label>Campus</label>
          <select class="select" name="campus">
            <option>Intramuros Campus</option>
            <option>Makati Campus</option>
          </select>
        </div>

        <div class="form-group">
          <label>Course</label>
          <input class="input" name="course" placeholder="e.g. BSIT">
        </div>

        <div class="form-group">
          <label>Avatar color</label>
          <input class="input" type="color" name="avatarColor">
        </div>

        <div class="form-group full">
          <button class="btn btn-primary" type="submit">Save profile</button>
        </div>
      </form>
    </div>
  </main>

<footer class="footer">
  <div class="container">Mapúan Marketplace · Built for safer campus peer-to-peer commerce.</div>
</footer>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/profile.js"></script>
</body>
</html>
